name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # ConstructCAD release whose ccad builds and checks the components.
  CONSTRUCTCAD_VERSION: v0.5.0

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download ccad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CONSTRUCTCAD_VERSION" -R francisreboucas/constructcad \
            -p "constructcad-$CONSTRUCTCAD_VERSION-x86_64-unknown-linux-gnu.tar.gz" -O ccad.tar.gz
          mkdir ccad
          tar -xzf ccad.tar.gz -C ccad
          echo "CCAD=$(find "$PWD/ccad" -name ccad -type f | head -1)" >> "$GITHUB_ENV"
      - run: python tools/build.py --check
